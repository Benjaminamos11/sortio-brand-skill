<!doctype html>
<html lang="de-CH">
<head>
<meta charset="UTF-8" />
<title>Sortio explainer thumbnail</title>
<!-- YouTube thumbnail, 1280x720. Edit the headline (max about 4 words a line) and the screen, then run
     python3 tools/thumbnail.py  ->  renders/thumbnail.jpg -->
<style>
  @font-face { font-family: "Hedvig Letters Serif"; font-weight: 400; src: url("../../assets/fonts/HedvigLettersSerif-24pt-Regular-latin.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../assets/fonts/Inter-Variable-latin.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url("../../assets/fonts/JetBrainsMono-Variable-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #faf9f6; -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; inset: 0; background: radial-gradient(520px 480px at 1000px 380px, rgba(255,79,0,0.16), rgba(255,79,0,0) 70%); }
  .eb { position: absolute; left: 72px; top: 96px; font: 500 24px/1 "JetBrains Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #8b8d98; }
  .eb b { color: #ff4f00; font-weight: 500; }
  h1 { position: absolute; left: 68px; top: 140px; font: 400 104px/1.02 "Hedvig Letters Serif", serif; letter-spacing: -0.03em; color: #0a0b0d; }
  h1 span { color: #ff4f00; display: block; }
  .lockup { position: absolute; left: 72px; bottom: 70px; display: flex; align-items: center; gap: 14px; font: 600 40px/1 "Inter", sans-serif; letter-spacing: -0.03em; color: #0a0b0d; }
  .lockup img { width: 58px; height: 58px; }
  .phone { position: absolute; left: 900px; top: 70px; width: 300px; height: 622px; border-radius: 48px; background: #0a0b0d; padding: 11px;
    transform: rotate(6deg); box-shadow: 0 0 0 1px rgba(10,11,13,0.06), 0 50px 90px -40px rgba(10,11,13,0.6); }
  .phone img { display: block; width: 278px; height: 600px; border-radius: 38px; object-fit: cover; object-position: top; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="eb"><b>Sortio</b> · erklärt</div>
  <h1>Deine Post,<span>endlich im Griff.</span></h1>
  <div class="lockup"><img alt="" src="../../assets/logo/sortio-mark-origami.png">Sortio</div>
  <div class="phone"><img alt="" src="../../assets/screens/review-result.webp"></div>
</body>
</html>
