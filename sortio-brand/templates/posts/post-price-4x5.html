<!doctype html>
<!-- Price post 4:5 (1080x1350). Prices as on sortio.ch (checked 20 Nov 2026):
     Basic CHF 0 with 8 scans per month, Pro CHF 10.– per month, monthly cancellable.
     Check the live site before every use: https://www.sortio.ch/#preise
     Optional yearly line (App Store: "Sortio Pro Jährlich" CHF 79.–) is in the comment below the list.
     Based on ad 03 "CHF 0 zum Start" (Set A, October 2026), with the price updated from 9.90 to 10.–. -->
<html lang="de-CH"><head><meta charset="utf-8">
<meta name="sortio:size" content="1080x1350">
<title>Price post 4:5</title>
<link rel="stylesheet" href="ads.css">
<style>
  .ad { padding: 80px 72px 0; }
  .hero { display: flex; align-items: center; gap: 44px; margin-top: 34px; }
  .price { display: flex; align-items: flex-start; color: var(--ink); }
  .price .cur { font-family: var(--font-mono); font-size: 54px; color: var(--steel); margin-top: 40px; margin-right: 22px; letter-spacing: -0.02em; }
  .price .num { font-family: var(--font-display); font-size: 380px; line-height: 0.8; letter-spacing: -0.03em; }
  .hero h1 { font-size: 104px; line-height: 1.0; }
  .hero h1 .e { display: block; color: var(--ember); }
  .sub { margin-top: 30px; font-size: 31px; line-height: 1.45; color: var(--graphite); letter-spacing: -0.01em; }
  .sub b { font-weight: 600; color: var(--ink); }
  .pro { margin-top: 52px; background: var(--ink); color: #fff; border-radius: 32px; padding: 42px 46px 40px; position: relative; overflow: hidden; box-shadow: var(--shadow-float); }
  .pro .glow2 { position: absolute; right: -120px; top: -140px; width: 420px; height: 420px; border-radius: 50%; background: rgba(255,79,0,0.2); filter: blur(110px); }
  .pro .row1 { position: relative; display: flex; align-items: baseline; justify-content: space-between; }
  .pro .name { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; }
  .pro .note { margin-top: 6px; font-size: 24px; color: rgba(255,255,255,0.55); position: relative; }
  .pro .amt { font-family: var(--font-mono); display: flex; align-items: baseline; gap: 12px; }
  .pro .amt .c { font-size: 26px; color: rgba(255,255,255,0.55); }
  .pro .amt .n { font-size: 66px; letter-spacing: -0.03em; }
  .pro .amt .m { font-family: var(--font-sans); font-size: 24px; color: rgba(255,255,255,0.55); }
  .pro ul { position: relative; list-style: none; margin-top: 34px; display: grid; grid-template-columns: 1fr; gap: 20px; }
  .pro li { display: flex; align-items: center; gap: 14px; font-size: 27px; color: rgba(255,255,255,0.88); letter-spacing: -0.01em; }
  .pro li svg { width: 26px; height: 26px; flex-shrink: 0; fill: none; stroke: var(--ember); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  .pro .fine { position: relative; margin-top: 30px; padding-top: 24px; border-top: 1.5px solid rgba(255,255,255,0.12); font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 72px; display: flex; align-items: center; justify-content: space-between; }
</style></head>
<body>
<div class="ad post">
  <p class="eyebrow">Preise</p>
  <div class="hero" data-check="hero">
    <div class="price"><span class="cur">CHF</span><span class="num">0</span></div>
    <h1 class="serif">zum<span class="e">Start.</span></h1>
  </div>
  <p class="sub" data-check="sub"><b>Sortio Basic:</b> 8 Scans pro Monat, gratis.</p>

  <div class="pro">
    <div class="glow2"></div>
    <div class="row1" data-check="pro-price">
      <span class="name">Pro</span>
      <span class="amt"><span class="c">CHF</span><span class="n">10.–</span><span class="m">/ Monat</span></span>
    </div>
    <p class="note">Für Privat und Selbständige</p>
    <ul data-check="pro-features">
      <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Unbegrenzte Scans</li>
      <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Sortio AI: frag deine Unterlagen</li>
      <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Auto-Fristen &amp; Kalender-Sync</li>
      <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>E-Mail-Entwürfe</li>
    </ul>
    <p class="fine">Monatlich kündbar</p>
    <!-- Optional yearly line (allowed since 20 Nov 2026; check the App Store listing first).
         If you mention the trial, also change the CTA below to "Im App Store testen" and add the fine print
         "Danach CHF 79.– im Jahr. Vor Ablauf im App Store kündbar." to the post or the caption:
    <p class="fine">Monatlich kündbar · Jahresabo CHF 79.– · 7 Tage gratis testen</p>
    -->
  </div>

  <div class="foot" data-check="foot">
    <span class="lockup"><img src="../../assets/logo/sortio-mark-origami.png" alt=""><span>Sortio</span></span>
    <span class="cta ember">Gratis starten</span>
  </div>
</div>
</body></html>
